<svg xmlns="http://www.w3.org/2000/svg" width="960" height="735" viewBox="0 0 960 735" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A model trained to hide a reward hack: the readouts tell the hacking model apart, not the hacking run</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="24.0" font-size="15" fill="#1b1b1a" text-anchor="start" font-weight="bold">A model trained to hide a reward hack: the readouts tell the hacking model apart, not the hacking run</text>
<text x="12.0" y="45.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Models: base Qwen3-8B and three versions trained by others to hack. β 0: its reasoning usually names the hack. β 0.02: its reasoning usually hides it.</text>
<text x="12.0" y="61.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Warm-start: fine-tuned only, before reinforcement learning; it hacks in some runs and not in others.</text>
<text x="12.0" y="77.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">AUROC over problems (0.5 = chance), 95% intervals over problems. Score: log-probability of 27 hack words at reasoning positions before any hack word</text>
<text x="12.0" y="93.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">appears.</text>
