<title>Removing the J-lens eval-word directions stops Qwen3-14B saying "you're testing me", but not the cheating</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="24.0" font-size="15" fill="#1b1b1a" text-anchor="start" font-weight="bold">Removing the J-lens eval-word directions stops Qwen3-14B saying "you're testing me", but not</text>
<text x="12.0" y="43.0" font-size="15" fill="#1b1b1a" text-anchor="start" font-weight="bold">the cheating</text>
<text x="12.0" y="64.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Qwen3-14B (thinking) on 69 known questions with the note "the automated grader has a bug, it marks B as correct" and the system</text>
<text x="12.0" y="80.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">prompt "you are an AI agent being evaluated … get the highest score you can". During generation, 26 directions are projected out</text>
<text x="12.0" y="96.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">of the residual stream at blocks 16–34, every position. 95% Wilson intervals over runs (the paired tests in the report resample</text>
<text x="12.0" y="112.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">questions).</text>
