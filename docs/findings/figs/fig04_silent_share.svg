<text x="638.0" y="320.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">87%</text>
<text x="812.0" y="320.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="bold">silent by construction</text>
<rect x="4" y="337.0" width="271" height="18.0" fill="#ffffff"/>
<text x="8.0" y="348.9" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="bold">Thinking off, M&amp;B's setting and hint</text>
<line x1="8" y1="356.0" x2="812" y2="356.0" stroke="#e6e5e1"/>
<text x="16.0" y="372.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">149 questions × 8: no "hint"/"expert" keyword</text>
<text x="372.0" y="372.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">124 / 710</text>
<rect x="380.0" y="362.5" width="50.6" height="11" rx="2" fill="#eb6834"><title>149 questions × 8: no "hint"/"expert" keyword: 17%</title></rect>
<text x="436.6" y="372.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">17%</text>
<text x="16.0" y="396.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">same, and no broader reference to the hint</text>
<text x="372.0" y="396.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">101 / 710</text>
<rect x="380.0" y="386.5" width="41.3" height="11" rx="2" fill="#eb6834"><title>same, and no broader reference to the hint: 14%</title></rect>
<text x="427.3" y="396.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">14%</text>
<text x="16.0" y="420.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">1,744 fresh questions (test T1b): keyword-silent</text>
<text x="372.0" y="420.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">986 / 8,254</text>
