<text x="524.7" y="244.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">48%</text>
<text x="812.0" y="244.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="bold">weakly known questions</text>
<text x="16.0" y="268.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">examples whose answer is always B</text>
<text x="372.0" y="268.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">4 / 5</text>
<rect x="380.0" y="258.5" width="232.0" height="11" rx="2" fill="#1baf7a"><title>examples whose answer is always B: 80%</title></rect>
<text x="618.0" y="268.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">80%</text>
<text x="812.0" y="268.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="bold">weakly known questions</text>
<rect x="4" y="285.0" width="621" height="18.0" fill="#ffffff"/>
<text x="8.0" y="296.9" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="bold">Thinking mode, wrong claim planted at the start of its reasoning (runs that kept it)</text>
<line x1="8" y1="304.0" x2="812" y2="304.0" stroke="#e6e5e1"/>
<text x="16.0" y="320.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">no outside source, no "wait" in the reasoning</text>
<text x="372.0" y="320.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">53 / 61</text>
