<text x="393.6" y="196.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">3%</text>
<text x="16.0" y="220.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">grader code</text>
<text x="372.0" y="220.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">2 / 28</text>
