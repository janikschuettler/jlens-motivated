<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Silent switches are rare in thinking mode and common without it</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="24.0" font-size="15" fill="#1b1b1a" text-anchor="start" font-weight="bold">Silent switches are rare in thinking mode and common without it</text>
<text x="12.0" y="45.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Share of switches (final answer = the pushed wrong option, known questions) whose reasoning and response never refer to the cue.</text>
<text x="12.0" y="61.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Counts are runs; keyword checks unless marked 'read by eye'. No intervals: switches cluster on a few questions.</text>
<line x1="380.0" y1="76.0" x2="380.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<line x1="438.0" y1="76.0" x2="438.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<line x1="496.0" y1="76.0" x2="496.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<line x1="554.0" y1="76.0" x2="554.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<line x1="612.0" y1="76.0" x2="612.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<line x1="670.0" y1="76.0" x2="670.0" y2="428.0" stroke="#e6e5e1" stroke-width="1"/>
<rect x="4" y="85.0" width="220" height="18.0" fill="#ffffff"/>
<text x="8.0" y="96.9" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="bold">Thinking mode, explicit hints</text>
<line x1="8" y1="104.0" x2="812" y2="104.0" stroke="#e6e5e1"/>
<text x="16.0" y="120.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">factual questions (wording runs + factorial)</text>
<text x="372.0" y="120.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">2 / 1,231</text>
<rect x="380.0" y="110.5" width="1.5" height="11" rx="2" fill="#2a78d6"><title>factual questions (wording runs + factorial): 0.2%</title></rect>
<text x="386.5" y="120.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">0.2%</text>
<text x="812.0" y="120.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="bold">both read: genuine</text>
<text x="16.0" y="144.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">known moral questions, M&amp;B's hint</text>
<text x="372.0" y="144.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">0 / 5,019</text>
<rect x="380.0" y="134.5" width="1.5" height="11" rx="2" fill="#2a78d6"><title>known moral questions, M&amp;B's hint: 0%</title></rect>
<text x="386.0" y="144.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">0%</text>
<rect x="4" y="161.0" width="424" height="18.0" fill="#ffffff"/>
<text x="8.0" y="172.9" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="bold">Thinking mode, cues that are not a sentence (read by eye)</text>
<line x1="8" y1="180.0" x2="812" y2="180.0" stroke="#e6e5e1"/>
<text x="16.0" y="196.0" font-size="12" fill="#1b1b1a" text-anchor="start" font-weight="normal">metadata tag</text>
<text x="372.0" y="196.0" font-size="10.5" fill="#8a8984" text-anchor="end" font-weight="normal">1 / 38</text>
