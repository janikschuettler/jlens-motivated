readout:
  prompt_tail: 1          # tracked tokens at the last prompt position + every completion position
  n_cot_anchors: 16       # evenly spaced over the <thinking> content: top-25 and block outputs
  resid_layers: [16, 24, 32]  # block outputs stored at the CoT anchors (fp16), for probes
