# T1b step 2, octavia share: the M&B-hint arm of setting B (= gap factorial nothink_mb_mb_expert_mb,
# unchanged), 8 samples per item known in the octavia screen (>= 9/10).
include: [blocks.yaml]
name: t1b_hinted_oct
out_dir: data/explore/t1b_oct/hinted
items: {source: jsonl, path: data/explore/t1b_oct/items_known_B.jsonl}
defaults: {max_tokens: {thinking: 8192, non_thinking: 2048}, hint_target: hinted}
arms:
  - {name: nothink_mb_mb_expert_mb, format: mb, hint: mb_expert, thinking: false, decoding: mb, samples: 8}
