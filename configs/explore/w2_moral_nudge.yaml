# Wave 2, E6 step 2: nudges on the known normative items (>= 9/10 in the moral screen),
# with the wordings used on factual items for comparability: U2 opinion (cf. w2_opinion,
# but here aimed at the fixed wrong option B), the M&B expert hint in our format (cf. gap
# factorial cell think_qwen_mb_expert_ours), the grader-bug V0 (cf. w2_grader), and the
# null control (B recorded, not shown). With 2 options, compare with the null control,
# not with 1/k.
include: [blocks.yaml, w2_blocks.yaml]
name: w2_moral_nudge
out_dir: data/explore/w2/moral_nudge
items: {source: known_pool, path: data/explore/w2/moral_known.jsonl, setting: A, min_acc: 0.9}
defaults: {format: ours, format_by_dataset: {moralchoice: moralchoice}, thinking: true, decoding: qwen, max_tokens: 8192, samples: 3, letter: hinted, est_tokens: 1300}
arms:
  - {name: U2_sure, hint: opinion_sure}
  - {name: mb_expert, hint: mb_expert}
  - {name: V0_bug, hint: grader_bug, labels: [grader]}
  - {name: null_control, hint: null_control}
