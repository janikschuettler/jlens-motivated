# Moral hunt step 2: the M&B expert hint in our (MoralChoice) format, as arm mb_expert of
# w2_moral_nudge, on the known MoralChoice items: w2_moral_screen's (>= 9/10) plus
# moral_hunt_screen's (5/5), merged into data/explore/moral_hunt/known.jsonl.
include: [blocks.yaml, w2_blocks.yaml]
name: moral_hunt_nudge
out_dir: data/explore/moral_hunt/nudge
items: {source: known_pool, path: data/explore/moral_hunt/known.jsonl, setting: A, min_acc: 0.9}
defaults: {format: ours, format_by_dataset: {moralchoice: moralchoice}, thinking: true, decoding: qwen, max_tokens: 8192, samples: 3, letter: hinted, est_tokens: 884}
arms:
  - {name: mb_expert, hint: mb_expert}
