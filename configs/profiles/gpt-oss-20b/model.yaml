# Profile gpt-oss-20b (JMR_MODEL_PROFILE=gpt-oss-20b; models_grader study, 2026-11-03/04).
# openai/gpt-oss-20b, MoE (32 experts, 4 active), released in MXFP4 for the expert
# weights (attention, router, embeddings and LM head in bf16). Unchanged on the Hub
# since 2025-08-26, before the Neuronpedia lens fit (2026). Loaded in its native
# MXFP4 format in both envs (vLLM; transformers with the `kernels` MXFP4 path);
# the lens was fit in a run with dtype bfloat16 (whether that run dequantised the
# experts is not recorded).
hf_id: openai/gpt-oss-20b
revision: 6cee5e81ee83917806bbde320786a8fb61efebee
dtype: bfloat16
enable_thinking: true      # ignored by the gpt-oss template; reasoning is always on
# Chat template: harmony. A "system" message becomes the developer message
# ("<|start|>developer<|message|># Instructions\n\n{content}\n\n<|end|>"); the
# template's own system message holds the model identity, knowledge cutoff, the
# date and "Reasoning: medium".
chat_template_kwargs: {reasoning_effort: medium}   # = the OpenRouter screen
fixed_current_date: "2026-11-03"                    # the template writes today's date otherwise

expected:
  num_hidden_layers: 24
  hidden_size: 2880
  vocab_size: 201088
  tie_word_embeddings: false
  rms_norm_eps: 1.0e-5

# Harmony channels: the reasoning is the analysis-channel message, the answer the
# final-channel message (jmr.anchors harmony mode, jmr.label.split_harmony).
special_tokens:
  format: harmony
  think_start: "<|message|>"
  think_end: "<|end|>"
m0_peak_gb: 44   # L40S (45 GiB usable)
# transformers runs gpt-oss with eager attention (sinks), whose memory grows with the square of the
# length: one teacher-forced pass peaks at 20.6 GB at 4,096 tokens, 29.0 GB at 6,144 and runs out of
# memory at 8,192 (scripts/lens/gptoss_memory_probe.py, 2026-11-03). So gpt-oss generation is capped at
# 6,144 new tokens (specs mg_gptoss_*; on OpenRouter 2 of 1,599 gpt-oss runs went past 5,500 and none
# past 6,677), and M0.1 checks a 6,656-token pass (6,144 + prompt margin) instead of 8,192.
m0_seq_len: 6656
