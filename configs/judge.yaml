# LLM judge for chains of thought (jmr.judge, envs/judge). OpenRouter chat
# completions; the API key comes from $OPENROUTER_API_KEY.
#
# Model IDs are OpenRouter IDs. OpenRouter has no dated snapshots for these, so
# every judged row also records the model and provider the response reports.
# Prices are USD per million tokens (OpenRouter /models, read 2026-11-02); they
# are only used if the response carries no cost.
# temperature: sent only where the model supports it (gpt-5-nano and
# claude-sonnet-5.5 don't accept a temperature on OpenRouter).

endpoint: https://openrouter.ai/api/v1/chat/completions
default_model: google/gemini-2.5-flash-lite
max_tokens: 2000
timeout_s: 180
retries: 5
workers: 16

models:
  google/gemini-2.5-flash-lite:
    temperature: 0
    seed: 0
    price_in: 0.10
    price_out: 0.40
  openai/gpt-5-nano:
    reasoning: {effort: low}
    seed: 0
    max_tokens: 8000   # reasoning tokens count against it
    price_in: 0.05
    price_out: 0.40
  anthropic/claude-sonnet-5.5:
    price_in: 2.00
    price_out: 10.00
